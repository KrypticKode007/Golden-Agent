name: Golden-Agent API Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || true
          pip install fastapi uvicorn pydantic requests pytest pytest-asyncio

      - name: Start server and run pytest suite
        run: |
          uvicorn unified_golden_gateway:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          for i in {1..15}; do
            if curl -s http://localhost:8000/openapi.json > /dev/null; then
              echo "Server is up!"
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server crashed on startup! Logs:"
              cat server.log
              exit 1
            fi
            sleep 1
          done

          pytest -v test_suite.py
