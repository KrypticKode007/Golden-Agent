name: Golden-Agent API Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic requests pytest

      - name: Start server and run pytest suite
        run: |
          python golden_agent/monolith.py > server.log 2>&1 &
          SERVER_PID=$!
          for i in {1..10}; do
            if curl -s http://localhost:8000/openapi.json > /dev/null; then
              break
            fi
            sleep 1
          done
          pytest -v test_suite.py
          kill $SERVER_PID || true
