name: Release & Publish Distribution

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools & verify test suite
        run: |
          python -m pip install --upgrade pip
          pip install build fastapi uvicorn rich pydantic httpx requests pytest pytest-asyncio pytest-cov
          pytest -v --cov=src/golden_agent --cov-fail-under=90 tests/unit tests/golden_evals test_suite.py
      - name: Build Wheel and Source Distribution
        run: python -m build
      - name: Publish GitHub Release with Artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
      - name: Publish to PyPI via Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
