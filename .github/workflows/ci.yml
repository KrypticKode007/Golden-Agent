name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || true
          pip install fastapi uvicorn pydantic httpx requests pytest pytest-asyncio pytest-cov ruff mypy
      - name: Lint with Ruff
        run: ruff check --select=E9,F63,F7,F82 .
      - name: Type-check with Mypy
        run: mypy src/golden_agent --ignore-missing-imports || true
      - name: Run Unit, Golden Eval & API Suites with Coverage
        run: pytest -v --cov=src/golden_agent --cov-report=term-missing tests/unit tests/golden_evals test_suite.py
