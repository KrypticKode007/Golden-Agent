services:
  golden-agent:
    build: .
    ports:
      - "8888:8888"
    environment:
      - GOLDEN_EXECUTION_MODE=hybrid
      - GOLDEN_OLLAMA_BASE_URL=http://ollama:11434
      - GOLDEN_QDRANT_URL=http://qdrant:6333
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
