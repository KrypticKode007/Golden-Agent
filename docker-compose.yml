version: '3.8'

services:
  edge-agent-monolith:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kryptic_edge_runtime
    volumes:
      # Map database paths to preserve monitoring telemetry across boots
      - .:/app
      # Create an isolation volume mount point for your sister repo logic loops
      - ../Offline-Conscious-Drone-:/app/Offline-Conscious-Drone-
    environment:
      - PYTHONUNBUFFERED=1
      - OPERATIONAL_MODE=1
    stdin_open: true
    tty: true
    restart: unless-stopped
    
