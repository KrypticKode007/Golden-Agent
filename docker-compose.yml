# Docker Compose stack for Ollama and Golden-Agent API
services:
  ollama:
    image: ollama/ollama:latest
    container_name: golden-ollama
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
    restart: unless-stopped
  golden-agent:
    build: .
    container_name: golden-agent-api
    depends_on: [ollama]
    ports: ["8000:8000"]
    environment:
      - GOLDEN_EXECUTION_MODE=local
      - GOLDEN_OLLAMA_BASE_URL=http://ollama:11434
    volumes: [.:/workspace]
    restart: unless-stopped
volumes:
  ollama_data:
