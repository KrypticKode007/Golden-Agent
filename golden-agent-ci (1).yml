name: Golden-Agent CI & Self-Healing Verification

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  verify-golden-agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Locate Golden-Agent monolith script
        id: locate
        run: |
          SCRIPT=$(find . -maxdepth 3 -name "golden_agent*.py" | sort -V | tail -n 1)
          if [ -z "$SCRIPT" ]; then
            echo "No golden_agent*.py script found!"
            exit 1
          fi
          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"
          echo "Testing monolith: $SCRIPT"

      - name: Run full verification & self-healing suite
        run: python3 "${{ steps.locate.outputs.script }}" --verify

      - name: Verify CLI modules (Routine, Brain, Pathway, Game of Life, Affirmation, Ask, Manifest)
        run: |
          SCRIPT="${{ steps.locate.outputs.script }}"
          python3 "$SCRIPT" --routine > /dev/null
          python3 "$SCRIPT" --brain prefrontal_cortex > /dev/null
          python3 "$SCRIPT" --simulate-pathway "Morning focus routine" > /dev/null
          python3 "$SCRIPT" --game-of-life > /dev/null
          python3 "$SCRIPT" --affirm "clarity" > /dev/null
          python3 "$SCRIPT" --ask "Give me my routine and an affirmation" > /dev/null
          python3 "$SCRIPT" --export-manifest > /dev/null
          python3 "$SCRIPT" --daemon --max-cycles 2 > /dev/null
