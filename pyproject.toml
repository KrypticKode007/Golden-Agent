[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "golden-agent"
version = "0.1.0"
description = "Universal autonomous AI agent platform with multi-agent orchestration, sandboxed execution, hybrid RAG, and HITL guardrails."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "litellm>=1.50.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sse-starlette>=2.1.0",
    "rich>=13.9.0",
    "typer>=0.12.5",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
full = [
    "tiktoken>=0.8.0",
    "docker>=7.1.0",
    "mcp>=1.1.0",
    "qdrant-client>=1.12.0",
    "rank-bm25>=0.2.2",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
]

[project.scripts]
golden-agent = "golden_agent.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/golden_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
testpaths = ["tests"]
