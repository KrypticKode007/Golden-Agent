[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "golden-agent"
version = "1.0.0"
description = "Autonomous multi-agent DAG orchestration platform, hybrid AST RAG engine, and autonomic self-healing cognitive runtime."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Brandon Mark Wilson (KrypticKode007)" },
]
keywords = [
    "autonomous-agents",
    "multi-agent-orchestration",
    "dag-execution",
    "hybrid-rag",
    "ast-indexing",
    "self-healing-ai",
    "mcp-protocol",
    "hitl-guardrails",
    "edge-ai",
    "fastapi",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Android",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "rich>=13.9.0",
    "typer>=0.12.5",
    "pyyaml>=6.0.2",
]

[project.urls]
Homepage = "https://github.com"
Repository = "https://github.com.git"
Architecture = "https://github.com/blob/main/docs/ARCHITECTURE.md"
"API Reference" = "https://github.com/blob/main/docs/API_REFERENCE.md"
"Enterprise Licensing" = "https://github.com/blob/main/docs/ENTERPRISE.md"
Issues = "https://github.com/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "build>=1.2.2",
]
full = [
    "litellm>=1.50.0",
    "tiktoken>=0.8.0",
    "docker>=7.1.0",
    "mcp>=1.1.0",
    "qdrant-client>=1.12.0",
    "rank-bm25>=0.2.2",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
]

[project.scripts]
golden-agent = "golden_agent.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/golden_agent"]

[tool.pytest.ini_options]
filterwarnings = ["ignore:.*iscoroutinefunction.*:DeprecationWarning"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/golden_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
